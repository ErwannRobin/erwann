  <body>
    <div id="root"></div>
    <script>
      // A dev-server restart can leave this tab pointing at module files that no
      // longer exist, which blanks the screen. Recover with a single reload.
      (function () {
        var KEY = "module-recovery-reload";
        var RELOADABLE =
          /importing a module script failed|failed to fetch dynamically imported module|error loading dynamically imported module/i;
        function reloadOnce() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {}
          window.location.reload();
        }
        window.addEventListener("vite:preloadError", reloadOnce);
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target !== window && (target.tagName === "SCRIPT" || target.tagName === "LINK")) {
              reloadOnce();
              return;
            }
            if (RELOADABLE.test(String(event.message || ""))) reloadOnce();
          },
          true
        );
        setTimeout(function () {
          try {
            sessionStorage.removeItem(KEY);
          } catch (e) {}
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
